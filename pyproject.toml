[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-log-exporter"
version = "0.1.0"
description = "Deterministic, engine-independent trade-log CSV export for Python backtests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Trade Log Analytics Team" }]
dependencies = [
    "duckdb>=1.1,<2",
    "pandas>=2.2,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
strategy = [
    "numpy>=1.26,<3",
    "numba>=0.60,<0.63",
    "matplotlib>=3.8,<4",
    "pyarrow>=15,<23",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "seaborn>=0.13,<1",
    "plotly>=5.20,<7",
    "statsmodels>=0.14,<1",
    "openpyxl>=3.1,<4",
]
[project.scripts]
trade-log = "trade_log_exporter.cli:main"
trade-dashboard = "trade_log_dashboard.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trade_log_exporter = ["py.typed"]
trade_log_dashboard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
